# SvelteKit 3 requires Node >= 22.17
[build.environment]
NODE_VERSION = "24"

[functions]
included_files = ["**/node_modules/harfbuzzjs/hb.wasm"]

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# One canonical host so link equity and the sitemap origin don't split across www/apex.
[[redirects]]
  from = "https://askhadith.com/*"
  to = "https://www.askhadith.com/:splat"
  status = 301
  force = true
