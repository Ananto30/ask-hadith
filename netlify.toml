# SvelteKit 3 requires Node >= 22.17
[build.environment]
NODE_VERSION = "24"

[functions]
included_files = ["**/node_modules/harfbuzzjs/hb.wasm"]

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
